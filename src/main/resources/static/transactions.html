<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Manager - Transactions</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js"></script>
</head>

<body>

    <header class="top-header">
        <h1>Finance Manager</h1>
    </header>


    <nav class="navbar">

        <div class="nav-container">

            <a href="/dashboard.html">Dashboard</a>

            <a href="/transactions.html" class="active">
                Transactions
            </a>

            <a href="/budgets.html">Budgets</a>

            <a href="/profile.html">Profile</a>

        </div>

    </nav>


    <main class="container">

        <section class="page-header">

            <h2>Add Transaction</h2>

        </section>


        <form id="transactionForm">

            <label for="title">
                Title:
            </label>

            <input
                type="text"
                id="title"
                required
            >


            <label for="amount">
                Amount:
            </label>

            <input
                type="number"
                id="amount"
                step="0.01"
                min="0.01"
                required
            >


            <label for="type">
                Type:
            </label>

            <select id="type" required>

                <option value="">
                    Select Type
                </option>

                <option value="INCOME">
                    Income
                </option>

                <option value="EXPENSE">
                    Expense
                </option>

            </select>


            <label for="category">
                Category:
            </label>

            <input
                type="text"
                id="category"
                required
            >


            <label for="transactionDate">
                Date:
            </label>

            <input
                type="date"
                id="transactionDate"
                required
            >


            <button type="submit">
                Add Transaction
            </button>

        </form>


        <p id="formMessage" class="message"></p>


        <section class="page-header">

            <h2>My Transactions</h2>

        </section>


        <p id="message" class="message"></p>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Amount</th>

                    <th>Type</th>

                    <th>Category</th>

                    <th>Date</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="transactionTableBody">

            </tbody>

        </table>


        <div class="page-actions">

            <button
                onclick="logout()"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </main>


    <script>

    async function loadTransactions() {

        if (!checkLogin()) {
            return;
        }

        const token = localStorage.getItem("token");


            try {

                const response =
                    await fetch("/transactions", {

                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }

                    });


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem("token");

                    window.location.href =
                        "/login.html";

                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load transactions"
                    );

                }


                const transactions =
                    await response.json();


                const tableBody =
                    document.getElementById(
                        "transactionTableBody"
                    );


                tableBody.innerHTML = "";


                if (transactions.length === 0) {

                    document.getElementById("message")
                        .textContent =
                        "No transactions found.";

                    return;
                }


                document.getElementById("message")
                    .textContent = "";


                transactions.forEach(
                    function(transaction) {

                        const row =
                            document.createElement("tr");


                        row.innerHTML = `

                            <td>
                                ${transaction.id}
                            </td>

                            <td>
                                ${transaction.title}
                            </td>

                            <td>
                                ₹ ${transaction.amount}
                            </td>

                            <td>
                                ${transaction.type}
                            </td>

                            <td>
                                ${transaction.category}
                            </td>

                            <td>
                                ${transaction.transactionDate}
                            </td>

                            <td>

                                <button
                                    onclick="editTransaction(${transaction.id})"
                                >
                                    Edit
                                </button>

                                <button
                                    onclick="deleteTransaction(${transaction.id})"
                                >
                                    Delete
                                </button>

                            </td>

                        `;


                        tableBody.appendChild(row);

                    }
                );


            } catch (error) {

                document.getElementById("message")
                    .textContent =
                    error.message;

            }

        }


        document.getElementById("transactionForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const token =
                        localStorage.getItem("token");


                    if (!token) {

                        window.location.href =
                            "/login.html";

                        return;
                    }


                    const transaction = {

                        title:
                            document.getElementById(
                                "title"
                            ).value,

                        amount:
                            document.getElementById(
                                "amount"
                            ).value,

                        type:
                            document.getElementById(
                                "type"
                            ).value,

                        category:
                            document.getElementById(
                                "category"
                            ).value,

                        transactionDate:
                            document.getElementById(
                                "transactionDate"
                            ).value

                    };


                    try {

                        const response =
                            await fetch(
                                "/transactions",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify(
                                            transaction
                                        )

                                }
                            );


                        const data =
                            await response.json();


                        if (response.ok) {

                            document.getElementById(
                                "formMessage"
                            ).textContent =
                                "Transaction added successfully!";


                            document.getElementById(
                                "transactionForm"
                            ).reset();


                            loadTransactions();


                        } else {

                            const errors =
                                Object.values(data);


                            document.getElementById(
                                "formMessage"
                            ).textContent =

                                errors.length > 0

                                    ? errors.join(", ")

                                    : "Unable to add transaction.";

                        }


                    } catch (error) {

                        document.getElementById(
                            "formMessage"
                        ).textContent =
                            "Unable to connect to server.";

                    }

                }
            );


        async function editTransaction(id) {

            const token =
                localStorage.getItem("token");


            const title =
                prompt("Enter new title:");

            if (title === null) return;


            const amount =
                prompt("Enter new amount:");

            if (amount === null) return;


            const type =
                prompt(
                    "Enter type (INCOME or EXPENSE):"
                );

            if (type === null) return;


            const category =
                prompt("Enter new category:");

            if (category === null) return;


            const transactionDate =
                prompt(
                    "Enter date (YYYY-MM-DD):"
                );

            if (transactionDate === null) return;


            const updatedTransaction = {

                title: title,

                amount: amount,

                type: type.toUpperCase(),

                category: category,

                transactionDate: transactionDate

            };


            try {

                const response =
                    await fetch(
                        "/transactions/" + id,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body:
                                JSON.stringify(
                                    updatedTransaction
                                )

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    alert(
                        "Transaction updated successfully!"
                    );

                    loadTransactions();


                } else {

                    const errors =
                        Object.values(data);


                    alert(

                        errors.length > 0

                            ? errors.join(", ")

                            : "Unable to update transaction."

                    );

                }


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        async function deleteTransaction(id) {

            const token =
                localStorage.getItem("token");


            const confirmed =
                confirm(
                    "Are you sure you want to delete this transaction?"
                );


            if (!confirmed) return;


            try {

                const response =
                    await fetch(
                        "/transactions/" + id,
                        {

                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (response.ok) {

                    alert(
                        "Transaction deleted successfully!"
                    );

                    loadTransactions();


                } else {

                    const data =
                        await response.json();


                    alert(
                        data.error ||
                        "Unable to delete transaction."
                    );

                }


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        function logout() {

            localStorage.removeItem("token");

            window.location.href =
                "/login.html";

        }


        loadTransactions();

    </script>

</body>

</html>
