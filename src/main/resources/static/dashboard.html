<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Manager - Dashboard</title>

    <link rel="stylesheet"href="/css/style.css">
	<script src="/js/app.js"></script>

</head>


<body>


    <!-- Header -->

    <header class="top-header">

        <h1>Finance Manager</h1>

    </header>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="/dashboard.html"
               class="active">
                Dashboard
            </a>

            <a href="/transactions.html">
                Transactions
            </a>

            <a href="/budgets.html">
                Budgets
            </a>

            <a href="/profile.html">
                Profile
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container">


        <!-- Dashboard Heading -->

        <section class="page-header">

            <h2>Dashboard</h2>

            <p id="welcomeMessage">
                Loading...
            </p>

        </section>


        <!-- Summary Cards -->

        <section class="dashboard-cards">


            <!-- Income -->

            <div class="dashboard-card">

                <h3>
                    Total Income
                </h3>

                <p id="totalIncome"
                   class="amount income-amount">
                    Loading...
                </p>

            </div>


            <!-- Expense -->

            <div class="dashboard-card">

                <h3>
                    Total Expense
                </h3>

                <p id="totalExpense"
                   class="amount expense-amount">
                    Loading...
                </p>

            </div>


            <!-- Balance -->

            <div class="dashboard-card">

                <h3>
                    Balance
                </h3>

                <p id="balance"
                   class="amount balance-amount">
                    Loading...
                </p>

            </div>


        </section>


        <p id="message"
           class="message">
        </p>


        <div class="page-actions">

            <button
                onclick="logout()"
                class="logout-button">
                Logout
            </button>

        </div>


    </main>


    <script>


        async function loadDashboard() {


            const token =
                localStorage.getItem("token");


            if (!token) {

                window.location.href =
                    "/login.html";

                return;

            }


            try {


                /* =========================
                   GET CURRENT USER
                   ========================= */

                const userResponse =
                    await fetch("/users", {

                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    });


                if (
                    userResponse.status === 401 ||
                    userResponse.status === 403
                ) {

                    localStorage.removeItem("token");

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!userResponse.ok) {

                    throw new Error(
                        "Unable to load user information"
                    );

                }


                const user =
                    await userResponse.json();


                document.getElementById(
                    "welcomeMessage"
                ).textContent =
                    "Welcome, " + user.name + "!";


                /* =========================
                   GET DASHBOARD DATA
                   ========================= */

                const dashboardResponse =
                    await fetch(
                        "/dashboard/" + user.id,
                        {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (!dashboardResponse.ok) {

                    throw new Error(
                        "Unable to load dashboard"
                    );

                }


                const dashboard =
                    await dashboardResponse.json();


                document.getElementById(
                    "totalIncome"
                ).textContent =
                    "₹ " + dashboard.totalIncome;


                document.getElementById(
                    "totalExpense"
                ).textContent =
                    "₹ " + dashboard.totalExpense;


                document.getElementById(
                    "balance"
                ).textContent =
                    "₹ " + dashboard.balance;


            } catch (error) {


                document.getElementById(
                    "message"
                ).textContent =
                    error.message;

            }

        }


        function logout() {

            localStorage.removeItem("token");

            window.location.href =
                "/login.html";

        }


        loadDashboard();


    </script>


</body>

</html>
