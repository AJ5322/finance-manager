<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Manager - Budgets</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js"></script>
</head>

<body>

    <!-- Header -->

    <header class="top-header">

    <h1>Finance Manager</h1>

</header>


<nav class="navbar">

    <div class="nav-container">

        <a href="/dashboard.html">
            Dashboard
        </a>

        <a href="/transactions.html">
            Transactions
        </a>

        <a href="/budgets.html" class="active">
    Budgets
</a>

<a href="/profile.html">
    Profile
</a>

    </div>

</nav>
    </div>

</header>

    <!-- Main Content -->

    <main class="container">

        <section class="page-header">

            <h2>Add Budget</h2>

        </section>


        <!-- Add Budget Form -->

        <form id="budgetForm">

            <label for="category">
                Category:
            </label>

            <input
                type="text"
                id="category"
                required
            >


            <label for="amount">
                Amount:
            </label>

            <input
                type="number"
                id="amount"
                step="0.01"
                min="0.01"
                required
            >


            <label for="month">
                Month:
            </label>

            <input
                type="month"
                id="month"
                required
            >


            <button type="submit">
                Add Budget
            </button>

        </form>


        <p id="formMessage" class="message"></p>


        <!-- My Budgets -->

        <section class="page-header">

            <h2>My Budgets</h2>

        </section>


        <p id="message" class="message"></p>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Category</th>

                    <th>Amount</th>

                    <th>Month</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="budgetTableBody">

            </tbody>

        </table>


        <div class="page-actions">

            <button
                onclick="logout()"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </main>


    <script>

    async function loadBudgets() {

        if (!checkLogin()) {
            return;
        }

        const token = localStorage.getItem("token");


            try {

                const response =
                    await fetch("/budgets", {

                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }

                    });


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem("token");

                    window.location.href =
                        "/login.html";

                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load budgets"
                    );

                }


                const budgets =
                    await response.json();


                const tableBody =
                    document.getElementById(
                        "budgetTableBody"
                    );


                tableBody.innerHTML = "";


                if (budgets.length === 0) {

                    document.getElementById("message")
                        .textContent =
                        "No budgets found.";

                    return;
                }


                document.getElementById("message")
                    .textContent = "";


                budgets.forEach(
                    function(budget) {

                        const row =
                            document.createElement("tr");


                        row.innerHTML = `

                            <td>
                                ${budget.id}
                            </td>

                            <td>
                                ${budget.category}
                            </td>

                            <td>
                                ₹ ${budget.amount}
                            </td>

                            <td>
                                ${budget.month}
                            </td>

                            <td>

                                <button
                                    onclick="editBudget(${budget.id})"
                                >
                                    Edit
                                </button>

                                <button
                                    onclick="deleteBudget(${budget.id})"
                                >
                                    Delete
                                </button>

                            </td>

                        `;


                        tableBody.appendChild(row);

                    }
                );


            } catch (error) {

                document.getElementById("message")
                    .textContent =
                    error.message;

            }

        }


        document.getElementById("budgetForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const token =
                        localStorage.getItem("token");


                    if (!token) {

                        window.location.href =
                            "/login.html";

                        return;
                    }


                    const budget = {

                        category:
                            document.getElementById(
                                "category"
                            ).value,

                        amount:
                            document.getElementById(
                                "amount"
                            ).value,

                        month:
                            document.getElementById(
                                "month"
                            ).value

                    };


                    try {

                        const response =
                            await fetch(
                                "/budgets",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify(
                                            budget
                                        )

                                }
                            );


                        const data =
                            await response.json();


                        if (response.ok) {

                            document.getElementById(
                                "formMessage"
                            ).textContent =
                                "Budget added successfully!";


                            document.getElementById(
                                "budgetForm"
                            ).reset();


                            loadBudgets();


                        } else {

                            const errors =
                                Object.values(data);


                            document.getElementById(
                                "formMessage"
                            ).textContent =

                                errors.length > 0

                                    ? errors.join(", ")

                                    : "Unable to add budget.";

                        }


                    } catch (error) {

                        document.getElementById(
                            "formMessage"
                        ).textContent =
                            "Unable to connect to server.";

                    }

                }
            );


        async function editBudget(id) {

            const token =
                localStorage.getItem("token");


            const category =
                prompt("Enter new category:");

            if (category === null) return;


            const amount =
                prompt("Enter new amount:");

            if (amount === null) return;


            const month =
                prompt("Enter month (YYYY-MM):");

            if (month === null) return;


            const updatedBudget = {

                category: category,

                amount: amount,

                month: month

            };


            try {

                const response =
                    await fetch(
                        "/budgets/" + id,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body:
                                JSON.stringify(
                                    updatedBudget
                                )

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    alert(
                        "Budget updated successfully!"
                    );

                    loadBudgets();


                } else {

                    const errors =
                        Object.values(data);


                    alert(

                        errors.length > 0

                            ? errors.join(", ")

                            : "Unable to update budget."

                    );

                }


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        async function deleteBudget(id) {

            const token =
                localStorage.getItem("token");


            const confirmed =
                confirm(
                    "Are you sure you want to delete this budget?"
                );


            if (!confirmed) return;


            try {

                const response =
                    await fetch(
                        "/budgets/" + id,
                        {

                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (response.ok) {

                    alert(
                        "Budget deleted successfully!"
                    );

                    loadBudgets();


                } else {

                    const data =
                        await response.json();


                    alert(
                        data.error ||
                        "Unable to delete budget."
                    );

                }


            } catch (error) {

                alert(
                    "Unable to connect to server."
                );

            }

        }


        function logout() {

            localStorage.removeItem("token");

            window.location.href =
                "/login.html";

        }


        loadBudgets();

    </script>

</body>

</html>
